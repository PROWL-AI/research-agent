[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prowl-research-agent"
version = "0.1.0"
description = "Runbook-driven research agent that calls the Prowl MCP tool bank and produces evidence-backed reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PROWL AI" }]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
prowl-research = "research_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["runbooks/**/*", "report/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
