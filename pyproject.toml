[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prowl-research-agent"
dynamic = ["version"]
description = "Runbook-driven research agent that calls the Prowl MCP tool bank and produces evidence-backed reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PROWL AI" }]
dependencies = [
    "httpx>=0.27",
    "anyio>=4.0",
    "mcp>=1.9,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.5",
    "matplotlib>=3.8",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.14"]

[project.scripts]
prowl-research = "research_agent.__main__:main"
prowl-research-service = "research_agent.service.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["runbooks/**/*", "report/templates/**/*", "service/static/*", "service/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# This checkout sits inside another repository's folder (0xDEV/pyproject.toml has its own
# [tool.ruff]); without this section ruff silently used that one: target 3.10 (false F821 on
# BaseExceptionGroup) and a rule set nobody here chose (B-069).
[tool.ruff]
target-version = "py311"
line-length = 150
extend-exclude = ["node_modules", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = { attr = "research_agent.__version__" }
